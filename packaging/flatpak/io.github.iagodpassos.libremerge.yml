# Flatpak manifest for LibreMerge. Bump the tag and commit below on each
# release, and keep the Tree-sitter sources in sync with
# engine/TreeSitterGrammars.cmake.
id: io.github.iagodpassos.libremerge
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: libremerge

# Upstream installs libremerge.desktop and icons named "libremerge", but Flatpak
# only exports files named after the app ID. flatpak-builder renames them and
# updates Icon= and the metainfo <launchable> to match.
rename-desktop-file: libremerge.desktop
rename-icon: libremerge

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Compares arbitrary files and whole folder trees, with paths coming from the
  # command line or from git. The file-chooser portal cannot cover that.
  - --filesystem=host
  # git difftool hands over its files in /tmp, which "host" does not include.
  - --filesystem=/tmp

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  # the Dolphin service menu runs "libremerge" on the host, not the Flatpak
  - /share/kio

modules:
  # Build-time only: the engine needs header-only Boost.Flyweight, found through
  # Boost's CMake config. "headers" installs the headers and that config without
  # compiling any library.
  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=${FLATPAK_DEST} --with-libraries=headers
      - ./b2 -j ${FLATPAK_BUILDER_N_JOBS} install
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.bz2
        sha256: 5c1d40cb8e19adbf740a4ec2da35b3e58f3f5804b1dce44deb53df72193cbc6c
        x-checker-data:
          type: anitya
          project-id: 6845
          stable-only: true
          url-template: https://archives.boost.io/release/${major}.${minor}.${patch}/source/boost_${major}_${minor}_$patch.tar.bz2

  # Runtime library: only Poco::Foundation is used.
  - name: poco
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DPOCO_MINIMAL_BUILD=ON
      - -DENABLE_FASTLOGGER=OFF
    sources:
      - type: git
        url: https://github.com/pocoproject/poco.git
        tag: poco-1.15.4-release
        commit: 6a5667f432e1c5fe5591025ab03a2f8df37116b4

  # Build-time only: generates the filter-expression lexer.
  - name: re2c
    buildsystem: autotools
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://github.com/skvadrik/re2c/releases/download/4.6/re2c-4.6.tar.xz
        sha256: 75bf2696445e831d0d44e0d9f2909eeffc18c09757f222b2fb025f7e59fe130b

  # Build-time only: generates the filter-expression parser. lemon is a single
  # C file from SQLite, plus the parser template it reads.
  - name: lemon
    buildsystem: simple
    build-commands:
      - gcc -O2 -o lemon lemon.c
      - install -Dm755 lemon -t ${FLATPAK_DEST}/bin
      - install -Dm644 lempar.c -t ${FLATPAK_DEST}/share/lemon
    cleanup:
      - '*'
    sources:
      - type: file
        url: https://raw.githubusercontent.com/sqlite/sqlite/version-3.54.1/tool/lemon.c
        sha256: 18ae355d4379fed459e81accdda481e3d2a15c543bd148fd83890ecc0a55d0ee
      - type: file
        url: https://raw.githubusercontent.com/sqlite/sqlite/version-3.54.1/tool/lempar.c
        sha256: 72e998c9c61753acd8d3ee8f6b2057269669dae8aa1bb833c01d793f1a341498

  - name: libremerge
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      # Upstream's CMake downloads the Tree-sitter grammars at configure time
      # unless it finds the archives in this folder (same switch as its PKGBUILD).
      - -DLM_TREE_SITTER_DOWNLOAD_DIR=/run/build/libremerge/tree-sitter-archives
      # Without the unit tests, which would download GoogleTest.
      - -DLM_BUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/iagodpassos/libremerge.git
        tag: v1.6.0
        commit: ba460801d54bc492b6230aa7eb060d11859bea60
