name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install ninja poco boost icu4c googletest re2c lemon libarchive
      # the Qt the dmg ships (official binaries, as packaging/build_deps.sh
      # takes them), not Homebrew's latest
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          modules: 'qtimageformats'
          cache: true
          # an aqtinstall that knows Qt 6.12's repository
          aqtversion: '==3.3.*'
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: App selftests (offscreen)
        run: ./packaging/run_selftests.sh build/app/LibreMerge.app/Contents/MacOS/LibreMerge

  oldest-qt:
    # the distribution's Qt, the oldest supported: what compiles with the
    # Qt of the other jobs may need a newer one than the README promises
    name: Ubuntu (Qt 6.4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev qt6-image-formats-plugins \
            libgl1-mesa-dev libxkbcommon-dev libpoco-dev libboost-dev libicu-dev \
            re2c lemon libarchive-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --target LibreMerge
      - name: App selftests (offscreen)
        run: ./packaging/run_selftests.sh build/app/libremerge

  plasma:
    # a distribution's Qt with Plasma's own platform theme and Breeze, which
    # no binary of Qt's loads, and which no offscreen run can stand in for
    name: Debian 13 (Plasma theme)
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential \
            cmake ninja-build pkgconf qt6-base-dev qt6-image-formats-plugins libgl-dev \
            libxkbcommon-dev libpoco-dev libboost-dev libicu-dev re2c lemon libarchive-dev \
            plasma-integration breeze xvfb xauth dbus
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --target LibreMerge
      - name: Theme on Plasma, dark and light
        run: |
          for scheme in BreezeDark BreezeLight; do
            config=$(mktemp -d)
            cp "/usr/share/color-schemes/$scheme.colors" "$config/kdeglobals"
            XDG_CONFIG_HOME="$config" XDG_CURRENT_DESKTOP=KDE KDE_SESSION_VERSION=6 \
              KDE_FULL_SESSION=true QT_QPA_PLATFORMTHEME=kde QT_QPA_PLATFORM=xcb \
              xvfb-run -a dbus-run-session -- build/app/libremerge --selftest-theme | tee "$config/log"
            grep -q '^style: breeze$' "$config/log"
            grep -q '^theme: ok$' "$config/log"
          done

  linux:
    name: Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libpoco-dev libboost-dev \
            libicu-dev re2c lemon libgl1-mesa-dev libegl1 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-cursor0 libarchive-dev \
            appstream dbus python3-dbus python3-gi
      # the Qt version the AppImage ships; the AppImage's own Qt is built
      # on Debian 12 (packaging/linux/build_qt.sh), Qt's official binaries
      # need the glibc 2.38 this runner has
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          modules: 'qtimageformats'
          cache: true
          # an aqtinstall that knows Qt 6.12's repository
          aqtversion: '==3.3.*'
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: App selftests (offscreen)
        run: ./packaging/run_selftests.sh build/app/libremerge
      - name: Desktop portal color scheme
        # System theme follows GNOME/KDE's dark setting, read and watched
        # through the portal (current ReadOne and the older Read). The
        # system's Python, which has python3-dbus: install-qt-action puts
        # its own first in PATH
        run: |
          for mode in "" --legacy; do
            QT_QPA_PLATFORM=offscreen dbus-run-session -- /usr/bin/python3 \
              packaging/fake_portal.py $mode -- build/app/libremerge --selftest-portal
          done
      - name: AppStream metadata
        # the installed tree, as software centers and AppImageHub see it:
        # metainfo, desktop file and icons checked against each other
        run: |
          cmake --install build --prefix "$PWD/stage/usr"
          appstreamcli validate-tree --no-net --pedantic stage
